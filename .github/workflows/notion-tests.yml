name: Test Notion sync
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'notion-sync.json'
      - '.github/workflows/**'
      - 'notion-webhook/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  webhook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notion-webhook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - run: npm test
