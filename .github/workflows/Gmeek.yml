name: build Gmeek
run-name: ${{ inputs.source == 'notion-webhook' && 'Notion 自動發布' || 'build Gmeek' }}

on:
  push:
    branches: [main]
    paths: ['config.json', 'static/**/*.js', 'static/**/*.css', 'scripts/**', '.github/workflows/Gmeek.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: "build=只重建網站；notion-preview=預覽；notion-publish=正式同步並發布"
        type: choice
        default: build
        options: [build, notion-preview, notion-publish]
      preview_page:
        description: "預覽專用。貼上 blog 資料庫中的 Notion 文章連結或頁面 ID"
        type: string
        required: false
      source:
        description: "發布觸發來源（Webhook 自動填入）"
        type: choice
        default: manual
        options: [manual, notion-webhook]
      notion_to_webhook_ms:
        description: "Notion 事件至接收服務（量測專用）"
        type: string
        required: false
      webhook_to_dispatch_ms:
        description: "接收服務至 GitHub 派送（量測專用）"
        type: string
        required: false
      worker_dispatched_at:
        description: "GitHub 派送時間（量測專用）"
        type: string
        required: false
  issues:
    types: [opened, edited]
  schedule:
    - cron: "0 16 * * *"
    # Enabled by default; set NOTION_SYNC_ENABLED=false to pause automatic publishing.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  actions: read
  contents: write
  issues: write
  pages: write
  id-token: write

# Serialize all writers and deployments; never cancel after creating Issues.
concurrency:
  group: gmeek-publish
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Sync and generate blog
    runs-on: ubuntu-latest
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
       (github.event_name == 'issues' && github.event.repository.owner.id == github.event.sender.id) ||
       (github.event_name == 'schedule' &&
        (github.event.schedule == '0 16 * * *' || vars.NOTION_SYNC_ENABLED != 'false')))
    outputs:
      deploy: ${{ steps.mode.outputs.build == 'true' || (steps.sync.outputs.has_articles == 'true' && steps.mode.outputs.mode == 'notion-publish') }}
      notion_publish: ${{ steps.mode.outputs.mode == 'notion-publish' }}
      sync_failed: ${{ steps.sync.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Measure publication trigger and queue
        if: inputs.source == 'notion-webhook'
        continue-on-error: true
        env:
          NOTION_TO_WEBHOOK_MS: ${{ inputs.notion_to_webhook_ms }}
          WEBHOOK_TO_DISPATCH_MS: ${{ inputs.webhook_to_dispatch_ms }}
          WORKER_DISPATCHED_AT: ${{ inputs.worker_dispatched_at }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_timing.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Choose mode
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          EVENT: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/site_build.py choose
      - name: Install image support
        if: steps.mode.outputs.mode != 'assets'
        run: python -m pip install -r scripts/requirements-notion.txt
      - name: Process Notion publication commands
        id: sync
        if: steps.mode.outputs.mode == 'notion-publish'
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DELETE_TOKEN: ${{ secrets.NOTION_DELETE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_MODE: ${{ steps.mode.outputs.mode }}
        run: python scripts/sync_notion.py "${SYNC_MODE#notion-}"
      - name: Render and encrypt private preview
        if: steps.mode.outputs.mode == 'notion-preview'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_PREVIEW_PASSWORD: ${{ secrets.NOTION_PREVIEW_PASSWORD }}
          PREVIEW_PAGE: ${{ inputs.preview_page }}
        run: |
          if [ "${#NOTION_PREVIEW_PASSWORD}" -lt 20 ]; then
            echo "請先在 Repository secrets 設定至少 20 字元的 NOTION_PREVIEW_PASSWORD"
            exit 1
          fi
          python scripts/preview_notion.py
          node scripts/encrypt_preview.mjs
      - name: Save preview for review
        if: steps.mode.outputs.mode == 'notion-preview'
        uses: actions/upload-artifact@v4
        with:
          name: notion-preview
          path: work/notion-preview-encrypted/index.html
          if-no-files-found: error
          retention-days: 7
      - name: Preserve mappings and images before building
        if: steps.mode.outputs.mode == 'notion-publish' && steps.sync.outputs.has_articles == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .notion-sync/state.json
          if [ -d static/notion-assets ]; then git add static/notion-assets; fi
          if ! git diff --cached --quiet; then
            git commit -m "Save Notion article mappings and images"
            bash scripts/push_site_commit.sh
          fi
      - name: Set up Pages
        if: steps.mode.outputs.build == 'true' || (steps.mode.outputs.mode == 'notion-publish' && steps.sync.outputs.has_articles == 'true')
        uses: actions/configure-pages@v4
      - name: Get Gmeek source and dependencies
        if: steps.mode.outputs.mode == 'build' || (steps.mode.outputs.mode == 'notion-publish' && steps.sync.outputs.has_articles == 'true')
        run: |
          git clone https://github.com/Meekdai/Gmeek.git "$RUNNER_TEMP/Gmeek"
          version=$(python -c "import json; print(json.load(open('config.json'))['GMEEK_VERSION'])")
          if [ "$version" = "last" ]; then
            version=$(git -C "$RUNNER_TEMP/Gmeek" describe --tags "$(git -C "$RUNNER_TEMP/Gmeek" rev-list --tags --max-count=1)")
          fi
          git -C "$RUNNER_TEMP/Gmeek" checkout "$version"
          python -m pip install -r "$RUNNER_TEMP/Gmeek/requirements.txt"
      - name: Generate HTML
        if: steps.mode.outputs.mode == 'build' || (steps.mode.outputs.mode == 'notion-publish' && steps.sync.outputs.has_articles == 'true')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SYNC_MODE: ${{ steps.mode.outputs.mode }}
        run: python scripts/build_gmeek.py "$RUNNER_TEMP/Gmeek/Gmeek.py"
      - name: Refresh frontend resources
        if: steps.mode.outputs.mode == 'assets'
        run: python scripts/site_build.py refresh
      - name: Commit generated site
        if: steps.mode.outputs.build == 'true' || (steps.mode.outputs.mode == 'notion-publish' && steps.sync.outputs.has_articles == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs backup blogBase.json README.md .gmeek-build.json
          if ! git diff --cached --quiet; then
            git commit -m "Update site from Gmeek"
            bash scripts/push_site_commit.sh
          fi
      - name: Report site ready to deploy
        if: steps.mode.outputs.mode == 'notion-publish' && steps.sync.outputs.has_articles == 'true'
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_notion.py mark-deploying
      - name: Save deployment receipt
        if: always() && steps.mode.outputs.mode == 'notion-publish' && steps.sync.outputs.has_articles == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notion-batch
          path: work/notion-batch.json
          retention-days: 7
      - name: Upload site
        if: steps.mode.outputs.build == 'true' || (steps.mode.outputs.mode == 'notion-publish' && steps.sync.outputs.has_articles == 'true')
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - name: Report preflight failure
        if: steps.sync.outcome == 'failure' && steps.sync.outputs.has_articles != 'true'
        run: exit 1

  deploy:
    name: Deploy blog
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    name: Report deployment to Notion
    needs: [build, deploy]
    if: always() && needs.build.outputs.notion_publish == 'true' && needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: notion-batch
          path: work/
      - name: Record actual deployment result
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          result=failure
          if [ "$DEPLOY_RESULT" = "success" ]; then
            result=success
          elif [ "$BUILD_RESULT" = "failure" ]; then
            result=build-failure
          fi
          python scripts/sync_notion.py "finalize-$result"
      - name: Preserve successful deployment receipts
        if: always()
        run: |
          if [ -f .notion-sync/state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .notion-sync/state.json
            if ! git diff --cached --quiet; then
              git commit -m "Record deployed Notion article versions"
              bash scripts/push_site_commit.sh
            fi
          fi
      - name: Report partial sync failure
        if: needs.build.outputs.sync_failed == 'true'
        run: exit 1



