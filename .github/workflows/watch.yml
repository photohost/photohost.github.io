name: Sync viewing wall

on:
  workflow_dispatch:
  schedule:
    - cron: "30 17 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gmeek-publish
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image support
        run: python -m pip install -r scripts/requirements-notion.txt
      - name: Build completed viewing records
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WATCH_SOURCE_ID: ${{ secrets.NOTION_WATCH_SOURCE_ID }}
        run: python scripts/build_watch.py
      - name: Commit poster wall
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/watch.html static/watch-assets docs/watch.html docs/watch-assets .watch-sync/state.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update Notion viewing wall"
            bash scripts/push_site_commit.sh
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v4
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: docs/
  deploy:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
