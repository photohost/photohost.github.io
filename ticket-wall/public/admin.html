<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151515">
  <title>編輯票根 · 映畫鑑賞</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=admin-water">
  <script type="module" src="/admin.js?v=ticket-picker"></script>
  <script type="module" src="/admin-water.mjs"></script>
</head>
<body class="admin-water-page">
  <canvas id="admin-water" aria-hidden="true" hidden></canvas>
  <div class="page-shell admin-shell">
    <header class="site-header">
      <h1>票根編輯室</h1>
      <a class="text-link" href="/">查看公開票根牆</a>
    </header>
    <main class="editor-layout" data-view="list">
      <section class="list-panel" aria-labelledby="list-title">
        <div class="editor-heading">
          <h2 id="list-title">已儲存的票根</h2>
          <button id="new-ticket" class="quiet-button" type="button">＋ 新增</button>
        </div>
        <label for="ticket-search">搜尋票根</label>
        <input id="ticket-search" type="search" placeholder="片名、原文片名或觀影日期" autocomplete="off">
        <p id="list-loading" class="help" role="status">正在讀取…</p>
        <div id="ticket-list"></div>
      </section>
      <div class="editor-workspace">
      <section class="editor-panel" aria-labelledby="editor-title">
        <div class="editor-heading">
          <h2 id="editor-title" tabindex="-1">新票根</h2>
          <button id="back-to-list" class="quiet-button" type="button">‹ 票根清單</button>
        </div>
        <form id="ticket-form">
          <label for="title-zh">中文電影名</label>
          <input id="title-zh" name="title_zh" maxlength="120" autocomplete="off" placeholder="例：墜惡真相">
          <label for="title-original">原文電影名</label>
          <input id="title-original" name="title_original" maxlength="160" autocomplete="off" placeholder="例：Anatomie d’une chute">
          <label for="ticket-kind">作品類型</label>
          <select id="ticket-kind" name="kind">
            <option value="">請選擇作品類型</option>
            <option value="movie">Movie（電影）</option>
            <option value="drama">Drama（影集）</option>
          </select>
          <div class="form-pair">
            <div><label for="rating">評分（0–10）</label><input id="rating" name="rating" type="number" min="0" max="10" step="0.1" inputmode="decimal" placeholder="7.5"></div>
            <div><label for="watched-on">觀影日期</label><input id="watched-on" name="watched_on" type="date"></div>
          </div>
          <label for="poster">電影圖片</label>
          <input id="poster" name="poster" type="file" accept="image/jpeg,image/png,image/webp">
          <p class="help">圖片會在瀏覽器中縮小並壓縮後上傳。直式、橫式和正方形都會完整呈現。</p>
          <p id="form-message" class="notice" role="status" aria-live="polite" hidden></p>
          <div class="form-actions">
            <button id="save-draft" class="quiet-button" type="button">儲存草稿</button>
            <button id="publish" class="primary-button" type="button">發布票根</button>
          </div>
        </form>
      </section>
      <section class="preview-panel" aria-labelledby="preview-title">
        <h2 id="preview-title">票根預覽</h2>
        <div id="preview"></div>
      </section>
      </div>
    </main>
  </div>
</body>
</html>
